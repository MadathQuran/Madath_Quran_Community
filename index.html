<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quran Word Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Noto+Naskh+Arabic&display=swap" rel="stylesheet">
  <style>
    :root { color: #333; font-family: Poppins, sans-serif; }
    body { margin: 0; padding: 32px 16px; text-align: center; background: #fff; }
    h1 { color: #347a49; margin: 0 0 8px; }
    .intro { color: #666; margin: 0 auto 12px; }
    .start-quiz { display: inline-block; margin: 0 0 24px; padding: 10px 18px; border-radius: 999px; background: #347a49; color: #fff; text-decoration: none; font-weight: 600; }
    .start-quiz:hover, .start-quiz:focus { background: #286039; outline: none; }
    .surah-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; width: min(900px, 100%); margin: auto; }
    .surah-tile { display: block; padding: 18px 14px; border: 1px solid #d4e2d7; border-radius: 14px; background: #f8fbf8; color: #347a49; text-decoration: none; transition: .2s; }
    .surah-tile:hover, .surah-tile:focus { background: #eaf5ec; transform: translateY(-2px); outline: none; }
    .surah-number, .surah-arabic, .surah-name { display: block; }
    .surah-number { font-size: 14px; font-weight: 600; }
    .surah-arabic { margin: 5px 0; font: 25px 'Noto Naskh Arabic', serif; color: #333; }
    .surah-name { font-size: 14px; color: #666; }
    .status { color: #777; }
  </style>
</head>
<body>
  <h1>Quran Word Quiz</h1>
  <p class="intro">Choose a Surah to begin.</p>
  <a class="start-quiz" href="quiz.html?surah=1">Open Quiz</a>
  <main id="surahGrid" class="surah-grid" aria-label="Surah list"><p class="status">Loading Surahs…</p></main>
  <script>
    async function loadSurahList() {
      const grid = document.getElementById('surahGrid');
      try {
        const response = await fetch('data/surahs.json');
        if (!response.ok) throw new Error('Surah list unavailable');
        const surahs = await response.json();
        grid.innerHTML = surahs.map(surah => `
          <a class="surah-tile" href="quiz.html?surah=${encodeURIComponent(surah.id)}">
            <span class="surah-number">Surah ${surah.id}</span>
            <span class="surah-arabic" lang="ar" dir="rtl">${surah.name}</span>
            <span class="surah-name">${surah.englishName || ''}</span>
          </a>`).join('');
      } catch (error) {
        grid.innerHTML = '<p class="status">The Surah list could not be loaded. Please try again.</p>';
      }
    }
    loadSurahList();
  </script>
</body>
</html>
