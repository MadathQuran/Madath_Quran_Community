<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modern Quranic Word Quiz</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Noto+Naskh+Arabic&display=swap" rel="stylesheet">
  <style>
    :root { --green: #347a49; --light: #f1f5f2; --border: #d4e2d7; --ayah-size: 38px; --answer-size: 19px; --trans-size: 18px; }
    .root-word { font-size: 1.35em; font-weight: 600; color: #347a49; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 0 0; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; font-family: Poppins, sans-serif; text-align: center; color: #333; }
    .container { width: min(760px, 96%); padding: 12px 16px 0; }
    .top-line { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; width: 100%; height: 48px; min-height: 48px; margin-bottom: 4px; overflow: visible; }
    .page-navigation { justify-self: start; margin: 0; }
    .top-line #surahName { flex: 0 0 auto; margin: 0; font-size: 22px; }
    .top-line .surah-heading { justify-self: center; }
    .top-line .root-word-line { justify-self: end; min-width: 0; max-width: 100%; min-height: 0; margin: 0; align-items: center; }
    .top-line #rootWordContainer { max-width: 100%; justify-content: flex-end; white-space: normal; overflow-wrap: anywhere; text-align: right; }
    .navigation-button, button { font: 600 13px Poppins, sans-serif; cursor: pointer; }
    .navigation-button { display: inline-block; padding: 8px 14px; border: 1px solid var(--border); border-radius: 999px; background: var(--light); color: var(--green); text-decoration: none; }
    .navigation-button:hover, .navigation-button:focus, button:hover, button:focus { background: #4caf50; color: #fff; outline: none; }
    #surahName { color: #333; font: 600 24px/1.35 'Noto Naskh Arabic', serif; }
    #surahInfo { display: flex; justify-content: center; align-items: center; width: 100%; margin: 0 0 14px; color: #555; font-size: 15px; }
    #surahInfo:empty { display: none; }
    .surah-heading { display: flex; align-items: center; justify-content: center; min-width: 0; }
    .root-word-line { display: flex; justify-content: center; align-items: center; min-height: 24px; margin: 0 0 4px; }
    #rootWordContainer { display: inline-flex; align-items: center; gap: 4px; color: #666; font-size: 12px; white-space: nowrap; }
    #rootWordContainer[hidden] { display: none; }
    #rootWord { font-size: 1.25em; }
    #basmala { margin: 4px 0 10px; color: var(--green); font: 18px/1.4 'Noto Naskh Arabic', serif; }
    .ayah-picker-row { display: flex; justify-content: center; align-items: center; gap: 8px; min-height: 36px; margin: 0 0 14px; }
    .ayah-picker-row input[type="number"], .ayah-picker-row input[type="text"] { width: 64px; padding: 5px 6px; font-size: 13px; }
    .navigation-controls { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
    .navigation-controls .ayah-picker, .navigation-controls .loop-range { display: inline-flex; align-items: center; gap: 3px; color: #555; font-size: 11px; }
    .navigation-controls select, .navigation-controls input[type="number"], .navigation-controls input[type="text"] { width: 52px; max-width: 62px; padding: 4px; font-size: 11px; }
    .navigation-controls .loop-toggle { min-width: 32px; width: 32px; height: 30px; font-size: 18px; }
    .navigation-controls .ayah-loop { min-width: 32px; width: 32px; height: 30px; font-size: 18px; }
    #surahInfo .loop-range label { color: #555; font-size: 13px; }
    .ayah-loop { min-width: 44px; width: 44px; height: 38px; padding: 0; border: 1px solid var(--border); border-radius: 999px; background: var(--light); color: var(--green); font-size: 22px; line-height: 1; }
    .ayah-loop.looping { background: linear-gradient(135deg,#1478d4,#0759a7); color: #fff; box-shadow: 0 0 0 3px rgba(20,120,212,.16); }
    #ayahContainer { display: flex; justify-content: center; align-items: center; height: clamp(150px, 25vh, 240px); margin: 14px 0 18px; padding: 8px 0; }
    .ayah-navigation { position: fixed; top: 50%; z-index: 5; width: 42px; height: 42px; padding: 0; border: 1px solid var(--border); border-radius: 50%; background: var(--light); color: var(--green); font-size: 24px; line-height: 1; transform: translateY(-50%); }
    .ayah-navigation.left { left: 8px; }
    .ayah-navigation.right { right: 8px; }
    .ayah-navigation:disabled { opacity: .35; cursor: not-allowed; }
    .ayah-navigation:disabled:hover { background: var(--light); color: var(--green); }
    #ayahText { width: 100%; margin: 0 10px; color: #333; font: var(--ayah-size)/1.45 'Noto Naskh Arabic', serif; direction: rtl; }
    .ayah-word { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; direction: rtl; cursor: pointer; border-radius: 6px; transition: color .9s cubic-bezier(.22, 1, .36, 1), background-color .9s cubic-bezier(.22, 1, .36, 1), text-shadow .9s cubic-bezier(.22, 1, .36, 1); }
    .arabic-word { opacity: .86; transition: opacity .9s cubic-bezier(.22, 1, .36, 1); }
    #currentWordMeaning { order: 0; display: flex; flex: 0 0 auto; align-items: center; justify-content: center; width: 100%; height: calc(var(--answer-size) * 1.5); margin: 0 0 12px; padding: 0 8px; overflow: hidden; color: var(--green); font: var(--answer-size)/1.2 Poppins, sans-serif; direction: ltr; white-space: nowrap; text-overflow: ellipsis; }
    body:not(.read-mode) #currentWordMeaning,
    body.read-mode #currentWordMeaning { display: none; }
    .word-answer { display: none; max-width: 12em; margin-bottom: 8px; color: var(--green); font: var(--answer-size)/1.2 Poppins, sans-serif; direction: ltr; text-align: center; white-space: normal; overflow-wrap: anywhere; }
    body.read-mode .word-answer { display: block; }
    body.read-mode .ayah-word:not(.meaning-revealed) .word-answer { visibility: hidden; }
    body.read-mode .play-highlight .word-answer { font-weight: 700; }

    #ayahText.answers-hidden .word-answer { visibility: hidden; }
    body.read-mode #currentWordMeaning.answer-hidden { visibility: hidden; }
    .ayah-end { display: inline-block; margin-inline: .08em; font-size: .48em; line-height: 1; vertical-align: -0.12em; opacity: .78; }
    .ayah-word:hover, .ayah-word:focus { background: #eaf5ec; outline: none; }
    .highlight { color: #4caf50; font-weight: bold; background-color: rgba(76,175,80,.08); text-shadow: 1px 1px 8px rgba(40,167,69,.28); }
    .play-highlight { color: inherit; font-weight: bold; background: none; text-shadow: none; }
    .highlight .arabic-word, .play-highlight .arabic-word { opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      .ayah-word, .arabic-word { transition: none; }
    }
    .controls-row { position: fixed; left: 12px; right: 12px; bottom: 10px; z-index: 8; display: flex; justify-content: center; align-items: center; flex-wrap: nowrap; gap: 8px; width: auto; max-width: 728px; margin: 0 auto; padding: 8px 10px; overflow-x: auto; border: 1px solid var(--border); border-radius: 999px; background: rgba(255,255,255,.96); box-shadow: 0 4px 14px rgba(0,0,0,.12); scrollbar-width: thin; }
    .controls-row > * { flex: 0 0 auto; margin: 0; }
    .settings-panel { margin: 0; width: auto; }
    .speed-range { display: flex; align-items: center; gap: 6px; margin: 0; color: #555; font-size: 13px; }
    #speedSlider { width: 120px; accent-color: var(--green); }
    .mode-controls { margin: 0; }
    .speed-controls { margin: 0; }
    .answer-visibility { margin: 12px 0 0; }
    #optionsContainer { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: center; gap: 8px; min-height: 0; width: 100%; margin-top: 18px; padding: 4px 0 0; }
    #optionsContainer.play-answer { display: none; min-height: 0; }
    #optionsContainer button { width: 100%; min-height: 0; margin: 0; padding: 7px 10px; border: 2px solid #ddd; border-radius: 16px; background: #f8f9fa; color: #333; font-size: var(--answer-size); line-height: 1.2; }
    .correct { background: #4caf50 !important; color: #fff !important; }
    .incorrect { background: #dc3545 !important; color: #fff !important; }
    #transliterationContainer { min-height: 42px; margin-top: 15px; }
    .ayah-control { display: flex; justify-content: center; align-items: center; gap: 8px; margin: 12px 0; }
    .ayah-control label { color: #555; font-size: 13px; }
    .mode-controls { display: flex; justify-content: center; align-items: center; gap: 8px; margin: 0; }
    .mode-button { min-width: 100px; padding: 10px 14px; border: 0; border-radius: 999px; background: linear-gradient(135deg,#4caf50,#319b59); color: #fff; }
    .mode-button.reading { background: linear-gradient(135deg,#1478d4,#0759a7); }
    #transliterationText { margin: 0 15px; color: #666; font-size: var(--trans-size); }
    .speed-controls { display: flex; visibility: hidden; justify-content: center; align-items: center; gap: 6px; margin: 10px 0 4px; color: #666; font-size: 13px; }
    .speed-controls .pause-play { min-width: 42px; width: 42px; height: 36px; padding: 0; border: 0; border-radius: 50%; background: #333; color: #fff; font-size: 18px; line-height: 1; box-shadow: 0 3px 8px rgba(0,0,0,.2); transition: transform .15s ease, background-color .15s ease; }
    .speed-controls .pause-play:hover, .speed-controls .pause-play:focus { background: #111; transform: scale(1.06); outline: none; }
    .speed-controls.visible { visibility: visible; }

    .settings-panel { position: relative; display: flex; justify-content: center; align-items: center; margin: 0; width: auto; }
    .settings-trigger { display: flex; align-items: center; justify-content: center; width: 50px; height: 46px; margin: 0 auto; padding: 0; border: 1px solid #d8e6dc; border-radius: 999px; background: linear-gradient(135deg,#4caf50,#319b59); color: #111 !important; font-size: 24px; line-height: 1; box-shadow: 0 4px 10px rgba(76,175,80,.22); }
    .settings-trigger:hover, .settings-trigger:focus { color: #111 !important; }
    .below-loop-content { display: none; position: fixed; top: 50%; left: 50%; z-index: 20; width: min(520px, calc(100vw - 32px)); max-height: min(620px, calc(100vh - 48px)); overflow-y: auto; padding: 56px 20px 24px; border: 1px solid var(--border); border-radius: 18px; background: rgba(255,255,255,.98); box-shadow: 0 8px 30px rgba(0,0,0,.22); transform: translate(-50%, -50%); }
    @media (max-width: 600px) {
      body { padding-top: 8px; }
      .container { width: 100%; padding: 8px 12px 110px; }
      .top-line #surahName { font-size: 19px; }

      .controls-row { left: 6px; right: 6px; bottom: 6px; gap: 4px; padding: 4px 6px; border-radius: 18px; overflow-x: auto; overflow-y: hidden; }
      .controls-row > * { flex: 0 1 auto; max-width: 100%; }
      .controls-row button, .controls-row .navigation-button { padding: 6px 8px; font-size: 11px; }
      .settings-trigger { width: 38px; height: 36px; font-size: 19px; }

      .speed-range { max-width: 100%; gap: 3px; font-size: 11px; }

      .speed-controls .pause-play { width: 32px; min-width: 32px; height: 30px; font-size: 14px; }
      .mode-button { min-width: 68px; padding: 7px 8px; }
      #answerVisibilityButton { padding: 6px 8px; }
      #optionsContainer { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 12px; margin-bottom: 12px; }
      #optionsContainer button { padding: 6px 7px; font-size: 13px; border-radius: 12px; }
    }
    .settings-panel.open .below-loop-content { display: block; }
    .ayah-picker { display: inline-flex; align-items: center; gap: 4px; color: #555; font-size: 13px; white-space: nowrap; }
    .ayah-picker select { padding: 5px 7px; }
    .quiz-score { display: flex; align-items: center; gap: 7px; font-weight: 600; }
    .quiz-score:not(.visible) { display: none; }
    .quiz-score span { min-width: 18px; }
    .controls-row { bottom: 10px; }
    #ayahContainer { min-height: 150px; height: auto; margin: 24px 0 22px; padding: 18px 0; }

    #optionsContainer button { width: max-content; max-width: 100%; justify-self: center; padding: 7px 10px; }
    #speedControls { overflow: visible; }
    #speedControls select { padding: 5px 6px; border-radius: 999px; color: var(--green); }
    @media (max-width: 600px) {
      .top-line { gap: 5px; min-height: 40px; overflow: visible; }
      .top-line #surahName { font-size: 18px; }
      .navigation-button { padding: 6px 8px; font-size: 11px; }
      .ayah-picker-row { gap: 5px; margin-bottom: 12px; }
      .ayah-picker-row input[type="number"], .ayah-picker-row input[type="text"] { width: 56px; padding: 4px; font-size: 16px; }
      #surahInfo { justify-content: center; flex-wrap: wrap; gap: 5px 8px; min-height: 44px; overflow: visible; white-space: normal; }
      #surahInfo .loop-range { flex-wrap: nowrap; }
      #surahInfo select { padding: 4px 5px; }
      .ayah-loop, .loop-toggle { min-width: 36px; width: 36px; height: 32px; font-size: 18px; }
      #ayahContainer { margin-top: 24px; padding: 18px 0; }
      #optionsContainer { margin-bottom: 125px; }
      #optionsContainer button { padding: 6px 7px; font-size: 13px; border-radius: 12px; }
      .controls-row { left: 4px; right: 4px; bottom: 5px; gap: 3px; padding: 4px; }
      .controls-row button, .controls-row .navigation-button { padding: 5px 6px; font-size: 10px; }
      .quiz-score { gap: 3px; font-size: 11px; }

      .speed-controls .pause-play { width: 28px; min-width: 28px; height: 28px; font-size: 13px; }
    }
    .settings-close { position: absolute; top: 8px; right: 10px; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 50%; background: var(--light); color: var(--green); font-size: 22px; line-height: 1; }
    .settings-close:hover, .settings-close:focus { background: #4caf50; color: #fff; }
    .answer-visibility { display: flex; justify-content: center; align-items: center; margin: 0; }
    #answerVisibilityButton { padding: 7px 14px; border: 1px solid var(--border); border-radius: 999px; background: var(--light); color: var(--green); font: 600 13px Poppins, sans-serif; cursor: pointer; }
    #answerVisibilityButton:hover, #answerVisibilityButton:focus { background: #4caf50; color: #fff; outline: none; }
    #answerVisibilityButton[aria-pressed="true"] { background: var(--green); color: #fff; }
    #answerVisibilityButton[aria-pressed="true"]:hover, #answerVisibilityButton[aria-pressed="true"]:focus { background: #28633a; color: #fff; }
    #optionsContainer.play-answer { grid-template-columns: 1fr; }
    #optionsContainer.play-answer button { max-width: 320px; margin: 0 auto; }
    .ayah-selectors, .text-size-controls-row, .control-buttons, .zoom-controls, #scoreWrapper { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; }
    .ayah-selectors { direction: ltr; }
    .ayah-selectors label, .size-label, .quiz-options-control label { color: #555; font-size: 13px; }
    select { padding: 6px 10px; border: 1px solid #ccc; border-radius: 8px; background: #fff; }
    .quiz-options-control { display: flex; justify-content: center; align-items: center; gap: 8px; margin: 10px 0; }
    .loop-range { display: flex; align-items: center; gap: 5px; }
    .control-buttons { margin: 10px 0; }
    .control-buttons button, .speedButton { min-width: 92px; padding: 10px 14px; border: 0; border-radius: 999px; background: linear-gradient(135deg,#4caf50,#319b59); color: #fff; }
    .control-buttons button.playing { background: linear-gradient(135deg,#1478d4,#0759a7); }
    .loop-toggle { min-width: 44px; width: 44px; height: 38px; padding: 0; border: 1px solid var(--border); border-radius: 999px; background: var(--light); color: var(--green); font-size: 22px; line-height: 1; }
    .loop-toggle:hover, .loop-toggle:focus { background: #eaf5ec; color: var(--green); }
    .loop-toggle.looping { background: linear-gradient(135deg,#1478d4,#0759a7); color: #fff; box-shadow: 0 0 0 3px rgba(20,120,212,.16); }
    .speed-controls { display: flex; visibility: hidden; justify-content: center; align-items: center; gap: 6px; margin: 0; }
    .speed-controls.visible { visibility: visible; }
    .answer-visibility { display: flex; justify-content: center; align-items: center; margin: 0; }
    #answerVisibilityButton { white-space: nowrap; }
    .speedButton { min-width: 78px; padding: 8px 14px; border: 0; border-radius: 999px; color: #fff; font-weight: 600; transition: transform .15s ease, filter .15s ease; }
    .speedButton:hover, .speedButton:focus { filter: brightness(.95); transform: translateY(-1px); outline: none; }
    .speedButton[data-speed="slow"] { background: #1976b9; }
    .speedButton[data-speed="fast"] { background: #d99719; }
    .speedButton.active-speed { color: #fff; box-shadow: 0 0 0 3px rgba(52,122,73,.18); }

    .size-label { min-width: 48px; }
    .zoom-controls { margin-top: 14px; }
    .zoom-button { width: 42px; height: 38px; font-size: 18px; }

    .score-value { margin: 0 5px; font-weight: bold; } .correct-value { color: #4caf50; } .wrong-value { color: #dc3545; }
    #completionModal { display: none; position: fixed; inset: 0; z-index: 20; justify-content: center; align-items: center; background: rgba(0,50,0,.6); }
    #completionMessage { width: min(400px,90%); padding: 20px; border-radius: 15px; background: #fff; }
    #completionMessage .navigation-button { margin: 10px 4px 0; }
    @media (max-width: 480px) { #surahName { font-size: 20px; } #ayahContainer { height: 130px; } #ayahText { font-size: var(--ayah-size); } #transliterationText { font-size: var(--trans-size); } #optionsContainer button { font-size: var(--answer-size); padding: 8px; } }

    /* Give long ayahs their own scroll area without moving surrounding controls. */
    body.quiz-mode #ayahContainer {
      flex: 1 1 0;
      height: 0;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      align-items: flex-start;
      scrollbar-gutter: stable;
    }
    body.quiz-mode #ayahText {
      flex: 0 0 auto;
      width: calc(100% - 20px);
      margin: auto 10px;
    }
    @media (max-width: 600px) {
      body.quiz-mode #ayahText {
        width: calc(100% - 68px);
        margin-right: 34px;
        margin-left: 34px;
      }
    }

    /* Keep the header stable and let the content stack naturally above the fixed controls. */
    .container { display: flex; flex-direction: column; padding-bottom: 52px; }

    #surahInfo { order: 1; margin-bottom: 24px; }

    #currentWordMeaning { order: 2; }
    body.read-mode #currentWordMeaning { order: 2; height: auto; min-height: calc(var(--answer-size) * 1.5); margin: 0; }
    body.read-mode #ayahContainer {

      flex: 0 0 auto;
      min-height: 0;
      margin: 0 0 24px;
      padding: 0;
      overflow: visible;

    /* Keep bottom controls anchored to their own areas. */
    .controls-row { max-width: none; justify-content: space-between; overflow-x: auto; overflow-y: hidden; }
    .controls-row .answer-visibility { margin-right: 0; }
    .quiz-score { position: static; transform: none; }
    .right-controls { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .speed-controls .pause-play { position: static; transform: none; }

    .speed-controls .pause-play:focus { transform: scale(1.06); }
    .speed-range span { display: inline-block; }

      .controls-row { left: 4px; right: 4px; gap: 3px; padding: 4px 5px; overflow-x: auto; overflow-y: hidden; }
      .controls-row > * { flex: 0 0 auto; max-width: none; }
      .navigation-controls { gap: 3px; }

      .speed-range { gap: 2px; font-size: 10px; }

<body class="quiz-mode">
  <button id="nextAyah" class="ayah-navigation left" type="button" aria-label="Next ayah">‹</button>
  <button id="previousAyah" class="ayah-navigation right" type="button" aria-label="Previous ayah">›</button>
  <main class="container">

    </div>

      <datalist id="ayahNumberOptions"></datalist>
      <button id="ayahLoopButton" class="ayah-loop" type="button" aria-label="Loop current ayah" aria-pressed="false" title="Loop current ayah">↺</button>
    </div>
    <div id="currentWordMeaning" aria-live="polite"></div>
    <div id="surahInfo" class="ayah-control"></div>
    <div id="ayahContainer"><p id="ayahText"></p></div>
    <div id="transliterationContainer"><p id="transliterationText"></p></div>
    <div id="optionsContainer"></div>
    <div class="controls-row">

              <option value="hide">Hide</option>
            </select>
          </div>
          <div class="text-size-controls-row">
            <div class="text-size-controls"><span class="size-label">Ayah</span><button data-size="ayah" data-change="-2" type="button">A−</button><button data-size="ayah" data-change="2" type="button">A+</button></div>
            <div class="text-size-controls"><span class="size-label">Answer</span><button data-size="answer" data-change="-1" type="button">A−</button><button data-size="answer" data-change="1" type="button">A+</button></div>
            <div class="text-size-controls"><span class="size-label">Trans</span><button data-size="trans" data-change="-1" type="button">A−</button><button data-size="trans" data-change="1" type="button">A+</button></div>
          </div>
          <div class="zoom-controls"><button id="zoomIn" class="zoom-button" type="button">＋</button><button id="zoomOut" class="zoom-button" type="button">−</button></div>
          <div id="scoreWrapper"><span class="score-value correct-value">Correct: <span id="rightCount">0</span></span> | <span class="score-value wrong-value">Wrong: <span id="wrongCount">0</span></span></div>
        </div>
      </section>
      <div class="navigation-controls">
        <span class="loop-range"><label for="loopStartSelect">Loop</label><input id="loopStartSelect" type="text" inputmode="numeric" pattern="[0-9]*" value="1" list="ayahNumberOptions" autocomplete="off" aria-label="Loop start ayah"><label for="loopEndSelect">to</label><input id="loopEndSelect" type="text" inputmode="numeric" pattern="[0-9]*" value="1" list="ayahNumberOptions" autocomplete="off" aria-label="Loop end ayah"><button id="loopButton" class="loop-toggle" type="button" aria-label="Enable range loop" aria-pressed="false" title="Enable range loop">↻</button></span>
      </div>
      <div class="answer-visibility"><button id="answerVisibilityButton" type="button" aria-label="Hide answers">H</button></div>
      <div id="speedControls" class="speed-controls" aria-label="Read speed">
        <label class="speed-range" for="speedSelect"><span>S</span><select id="speedSelect" aria-label="Reading speed"><option value="500">0.5s</option><option value="1000">1s</option><option value="1500" selected>1.5s</option><option value="2000">2s</option><option value="2500">2.5s</option><option value="3000">3s</option></select></label>
        <button id="pausePlayButton" class="pause-play" type="button" aria-label="Pause reading">Ⅱ</button>
      </div>
      <div id="quizScore" class="quiz-score visible" aria-label="Quiz score"><span id="rightCountBottom" class="correct-value">0</span><span id="wrongCountBottom" class="wrong-value">0</span></div>
      <div class="mode-controls">
        <button id="modeButton" class="mode-button" type="button" aria-label="Switch to Read mode"><strong>R</strong></button>
      </div>
    </div>
  </main>

  <div id="completionModal"><div id="completionMessage"><h2>Keep Going</h2><p>May your efforts be accepted by Allah.</p><p>Correct: <span id="totalRight">0</span> | Wrong: <span id="totalWrong">0</span></p><p>Time Taken: <span id="timeTaken"></span></p><button id="startOver" type="button">Start Over</button><button id="nextSurah" type="button">Next Surah</button><a class="navigation-button" href="index.html">Surah List</a></div></div>

  <script>
    const surahId = new URLSearchParams(location.search).get('surah') || '1';
    let surah, ayahs = [], currentAyah = 0, currentWord = 0, isPlayMode = false, isLoopMode = false;
    let rootWordVisible = true;
    let loopStartAyah = 0, loopEndAyah = 0, rightAttempts = 0, wrongAttempts = 0, timer, startTime;
    let speed = 1500, zoomLevel = 1, answersHidden = false, isPaused = false, isAyahLoopMode = false;
    let transliterationVisible = false;
    let endAction = 'repeat';
    let nextSurahId = null;
    const $ = id => document.getElementById(id);

    async function loadSurah() {
      try {
        const response = await fetch(`data/surah-${encodeURIComponent(surahId)}.json`);
        if (!response.ok) throw new Error('Unavailable');
        surah = await response.json();
        ayahs = surah.ayahs;
        try {
          const listResponse = await fetch('data/surahs.json');
          if (listResponse.ok) {
            const availableIds = (await listResponse.json()).map(item => Number(item.id)).sort((a, b) => a - b);
            nextSurahId = availableIds.find(id => id > Number(surahId)) ?? null;
          }
        } catch (error) {
          nextSurahId = null;
        }
        $('nextSurah').disabled = nextSurahId === null;
        // Surah 9 data may include an empty placeholder where the basmala would be.
        if (Number(surah.id) === 9 && ayahs[0]?.length && ayahs[0].every(item => !item?.word)) {
          ayahs = ayahs.slice(1);
        }
        const firstWord = ayahs[0]?.[0]?.word || '';
        const normalizedFirstWord = firstWord.replace(/[\u064B-\u065F\u0670\u0640]/g, '');
        if (Number(surah.id) !== 9 && normalizedFirstWord.startsWith('بسم')) ayahs = ayahs.slice(1);
        if (!ayahs.length) throw new Error('No ayahs available');
        currentAyah = currentWord = 0;
        loopStartAyah = 0;
        loopEndAyah = ayahs.length - 1;
        $('surahName').textContent = `${surah.name} ${surah.id}`;
        $('basmala').hidden = Number(surah.id) === 9;
        $('ayahNumberOptions').innerHTML = Array.from({ length: ayahs.length }, (_, index) => index + 1).sort((a, b) => a - b).map(number => `<option value="${number}"></option>`).join('');
        ['ayahSelect', 'loopStartSelect', 'loopEndSelect'].forEach(id => { $(id).max = ayahs.length; });
        $('ayahSelect').value = '1';
        $('loopStartSelect').value = '1';
        $('loopEndSelect').value = String(ayahs.length);
        applyRootWordVisibility();
        displayWord();
        updateAyahNavigation();
      } catch (error) {
        $('surahName').textContent = 'Unable to load this Surah';
        $('surahInfo').textContent = 'Return to the Surah List and choose an available Surah.';
      }
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);
    }

    function displayWord() {
      const ayah = ayahs[currentAyah], word = ayah[currentWord];
      const ayahText = $('ayahText');
      const ayahChanged = ayahText.dataset.ayahIndex !== String(currentAyah);
      const modeChanged = ayahText.dataset.playMode !== String(isPlayMode);

      // Keep the word elements in place while progressing so their highlight can ease between words.
      if (ayahChanged || modeChanged || ayahText.querySelectorAll('.ayah-word').length !== ayah.length) {
        ayahText.innerHTML = ayah.map((item, i) => `<span class="ayah-word" data-word-index="${i}" tabindex="${isPlayMode ? '-1' : '0'}" lang="ar" dir="rtl"><span class="word-answer" lang="en">${escapeHtml(item.correctMeaning || '')}</span><span class="arabic-word">${item.word}</span></span>`).join(' ') + ' <span class="ayah-end" lang="ar" aria-hidden="true">۝</span>';
        ayahText.dataset.ayahIndex = currentAyah;
        ayahText.dataset.playMode = isPlayMode;
        if (!isPlayMode) {
          ayahText.querySelectorAll('.ayah-word').forEach(element => {
            element.onclick = () => changeWord(Number(element.dataset.wordIndex));
            element.onkeydown = event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); changeWord(Number(element.dataset.wordIndex)); } };
          });
        }
      }
      ayahText.querySelectorAll('.ayah-word').forEach((element, index) => {
        element.classList.toggle('highlight', !isPlayMode && index === currentWord);
        element.classList.toggle('play-highlight', isPlayMode && index === currentWord);
        if (isPlayMode && index === currentWord) element.classList.add('meaning-revealed');
      });
      $('currentWordMeaning').textContent = isPlayMode ? word.correctMeaning : '';
      $('currentWordMeaning').title = isPlayMode ? word.correctMeaning : '';
      $('transliterationText').textContent = word.transliteration;
      $('rootWord').textContent = word.rootWord || 'N/A';
      $('ayahSelect').value = currentAyah + 1;
      isPlayMode ? showCorrectAnswer(word) : showOptions(word);
      keepActiveWordVisible();
    }

    function keepActiveWordVisible() {
      const container = $('ayahContainer');
      const revealActiveWord = () => {
        const activeWord = $('ayahText').querySelector('.highlight, .play-highlight');
        if (!activeWord) return;

        const containerRect = container.getBoundingClientRect();
        const wordRect = activeWord.getBoundingClientRect();
        const visibleTop = containerRect.top + container.clientTop;
        const visibleBottom = visibleTop + container.clientHeight;

        if (wordRect.top < visibleTop) {
          container.scrollTop -= visibleTop - wordRect.top;
        } else if (wordRect.bottom > visibleBottom) {
          container.scrollTop += wordRect.bottom - visibleBottom;
        }
      };
      revealActiveWord();
      requestAnimationFrame(revealActiveWord);
    }

    function showCorrectAnswer(word) { $('optionsContainer').classList.add('play-answer'); $('optionsContainer').innerHTML = ''; applyAnswerVisibility(); if (!isPaused) startAutoProgress(); }
    function changeWord(wordIndex) { if (isPlayMode || !surah) return; currentWord = wordIndex; clearTimeout(timer); displayWord(); }
    function showOptions(word) { $('optionsContainer').classList.remove('play-answer'); const optionCount = Number($('optionCountSelect').value); const answers = [...new Set([word.correctMeaning, ...(word.options || [])])].slice(0, optionCount).sort(() => Math.random() - .5); $('optionsContainer').innerHTML = ''; answers.forEach(answer => { const button = document.createElement('button'); button.type = 'button'; button.textContent = answer; button.onclick = () => checkAnswer(button, answer, word.correctMeaning); $('optionsContainer').appendChild(button); }); applyAnswerVisibility(); }
    function applyAnswerVisibility() {
      $('optionsContainer').style.visibility = answersHidden ? 'hidden' : 'visible';
      $('ayahText').classList.toggle('answers-hidden', answersHidden);
      $('currentWordMeaning').classList.toggle('answer-hidden', answersHidden);
      $('answerVisibilityButton').textContent = answersHidden ? 'A' : 'H';
      $('answerVisibilityButton').setAttribute('aria-pressed', String(answersHidden));
      $('answerVisibilityButton').setAttribute('aria-label', answersHidden ? 'Show answers' : 'Hide answers');
      $('answerVisibilityButton').title = answersHidden ? 'Show answers' : 'Hide answers';
    }
    function applyTransliterationVisibility() {
      $('transliterationContainer').hidden = !transliterationVisible;
    }
    function applyRootWordVisibility() {
      $('rootWordContainer').hidden = !rootWordVisible;
      $('rootWordToggle').value = rootWordVisible ? 'show' : 'hide';
    }
    function updateScore() { $('rightCount').textContent = rightAttempts; $('wrongCount').textContent = wrongAttempts; $('rightCountBottom').textContent = rightAttempts; $('wrongCountBottom').textContent = wrongAttempts; }
    function checkAnswer(button, answer, correct) { if (answer === correct) { button.classList.add('correct'); rightAttempts++; updateScore(); setTimeout(navigateNext, 700); } else { button.classList.add('incorrect'); wrongAttempts++; updateScore(); } }
    function navigateNext() {
      clearTimeout(timer);
      const ayah = ayahs[currentAyah];
      if (isAyahLoopMode && currentWord === ayah.length - 1) {
        currentWord = 0;
        displayWord();
        return;
      }
      if (currentWord < ayah.length - 1) currentWord++;
      else if (isLoopMode) {
        currentAyah = currentAyah >= loopStartAyah && currentAyah < loopEndAyah ? currentAyah + 1 : loopStartAyah;
        currentWord = 0;
      } else if (currentAyah < ayahs.length - 1) {
        currentAyah++;
        currentWord = 0;
      } else {
        finishSurah();
        return;
      }
      displayWord();
    }

    function finishSurah() {
      clearTimeout(timer);
      if (isPlayMode) {
        if (endAction === 'next' && nextSurahId !== null) {
          location.href = `quiz.html?surah=${nextSurahId}`;
        } else {
          currentAyah = 0;
          currentWord = 0;
          displayWord();
        }
        return;
      }
      showCompletion();
    }
    function getWordDuration(word) {
      const wordLength = [...word.word].length;
      return Math.max(650, Math.min(3200, speed + (wordLength - 5) * 140));
    }
    function startAutoProgress() { clearTimeout(timer); timer = setTimeout(navigateNext, getWordDuration(ayahs[currentAyah][currentWord])); }
    function togglePlay() { clearTimeout(timer); isPlayMode = !isPlayMode; document.body.classList.toggle('read-mode', isPlayMode); isPaused = false; $('modeButton').innerHTML = isPlayMode ? '<strong>Q</strong>' : '<strong>R</strong>'; $('modeButton').setAttribute('aria-label', isPlayMode ? 'Switch to Quiz mode' : 'Switch to Read mode'); $('modeButton').title = isPlayMode ? 'Switch to Quiz mode' : 'Switch to Read mode'; $('modeButton').classList.toggle('reading', isPlayMode); $('speedControls').classList.toggle('visible', isPlayMode); $('quizScore').classList.toggle('visible', !isPlayMode); $('pausePlayButton').textContent = 'Ⅱ'; $('pausePlayButton').setAttribute('aria-label', 'Pause reading'); if (isPlayMode) startTime = Date.now(); displayWord(); applyAnswerVisibility(); }
    function togglePause() { if (!isPlayMode) return; isPaused = !isPaused; if (isPaused) clearTimeout(timer); else startAutoProgress(); $('pausePlayButton').textContent = isPaused ? '▶' : 'Ⅱ'; $('pausePlayButton').setAttribute('aria-label', isPaused ? 'Resume reading' : 'Pause reading'); }
    function toggleLoop() {
      isLoopMode = !isLoopMode;
      const loopButton = $('loopButton');
      loopButton.classList.toggle('looping', isLoopMode);
      loopButton.setAttribute('aria-pressed', String(isLoopMode));
      loopButton.setAttribute('aria-label', isLoopMode ? 'Disable range loop' : 'Enable range loop');
      loopButton.title = isLoopMode ? 'Disable range loop' : 'Enable range loop';
      if (isLoopMode && surah && (currentAyah < loopStartAyah || currentAyah > loopEndAyah)) {
        currentAyah = loopStartAyah;
        currentWord = 0;
        displayWord();
        updateAyahNavigation();
      }
      if (isPlayMode && !isPaused) startAutoProgress();
    }
    function toggleAyahLoop() {
      isAyahLoopMode = !isAyahLoopMode;
      const button = $('ayahLoopButton');
      button.classList.toggle('looping', isAyahLoopMode);
      button.setAttribute('aria-pressed', String(isAyahLoopMode));
      button.setAttribute('aria-label', isAyahLoopMode ? 'Disable current ayah loop' : 'Loop current ayah');
      button.title = isAyahLoopMode ? 'Disable current ayah loop' : 'Loop current ayah';
      if (isPlayMode && !isPaused) startAutoProgress();
    }
    function changeAyah(value) { const requestedAyah = Number.parseInt(value, 10); currentAyah = Math.max(0, Math.min(ayahs.length - 1, (Number.isFinite(requestedAyah) ? requestedAyah : currentAyah + 1) - 1)); currentWord = 0; clearTimeout(timer); displayWord(); updateAyahNavigation(); if (isPlayMode) startAutoProgress(); }
    function moveAyah(amount) { if (!surah) return; const nextAyah = currentAyah + amount; if (nextAyah < 0 || nextAyah >= ayahs.length) return; changeAyah(nextAyah + 1); }
    function updateAyahNavigation() { $('previousAyah').disabled = !surah || currentAyah === 0; $('nextAyah').disabled = !surah || currentAyah === ayahs.length - 1; }
    function updateLoop() { const maxAyah = ayahs.length; const toIndex = (value, fallback) => Math.max(0, Math.min(maxAyah - 1, (Number.parseInt(value, 10) || fallback) - 1)); loopStartAyah = toIndex($('loopStartSelect').value, loopStartAyah + 1); loopEndAyah = toIndex($('loopEndSelect').value, loopEndAyah + 1); if (loopStartAyah > loopEndAyah) [loopStartAyah, loopEndAyah] = [loopEndAyah, loopStartAyah]; $('loopStartSelect').value = loopStartAyah + 1; $('loopEndSelect').value = loopEndAyah + 1; if (isPlayMode) startAutoProgress(); }
    function setFont(type, amount) { const root = document.documentElement, styles = { ayah: ['--ayah-size', 18, 72], answer: ['--answer-size', 12, 36], trans: ['--trans-size', 12, 36] }; const [property, min, max] = styles[type]; const current = parseFloat(getComputedStyle(root).getPropertyValue(property)); root.style.setProperty(property, `${Math.max(min, Math.min(max, current + amount))}px`); keepActiveWordVisible(); }
    function showCompletion() { $('totalRight').textContent = rightAttempts; $('totalWrong').textContent = wrongAttempts; $('timeTaken').textContent = formatTime(Math.floor((Date.now() - (startTime || Date.now())) / 1000)); $('completionModal').style.display = 'flex'; }
    function formatTime(seconds) { return [Math.floor(seconds / 3600), Math.floor(seconds / 60) % 60, seconds % 60].map(n => String(n).padStart(2, '0')).join(':'); }
    function startOver() { $('completionModal').style.display = 'none'; currentAyah = currentWord = rightAttempts = wrongAttempts = 0; updateScore(); startTime = Date.now(); displayWord(); }
    function goToNextSurah() { if (nextSurahId !== null) location.href = `quiz.html?surah=${nextSurahId}`; }

    function closeSettings() { $('settingsPanel').classList.remove('open'); $('settingsButton').setAttribute('aria-expanded', 'false'); }
    $('settingsButton').onclick = () => { const open = $('settingsPanel').classList.toggle('open'); $('settingsButton').setAttribute('aria-expanded', open); };
    $('settingsCloseButton').onclick = closeSettings;
    document.addEventListener('click', event => {
      if (!$('settingsPanel').contains(event.target)) closeSettings();
    });
    $('answerVisibilityButton').onclick = () => { answersHidden = !answersHidden; applyAnswerVisibility(); };
    $('modeButton').onclick = () => { closeSettings(); togglePlay(); };
    $('pausePlayButton').onclick = togglePause;
    $('previousAyah').onclick = () => moveAyah(-1);
    $('nextAyah').onclick = () => moveAyah(1);
    $('loopButton').onclick = toggleLoop; $('ayahLoopButton').onclick = toggleAyahLoop; $('ayahSelect').onchange = e => changeAyah(e.target.value); $('loopStartSelect').onchange = updateLoop; $('loopEndSelect').onchange = updateLoop;
    $('optionCountSelect').onchange = () => { if (!isPlayMode && surah) displayWord(); };
    $('endActionSelect').onchange = event => { endAction = event.target.value; };
    $('transliterationToggle').onchange = event => {
      transliterationVisible = event.target.value === 'show';
      applyTransliterationVisibility();
    };
    $('rootWordToggle').onchange = event => {
      rootWordVisible = event.target.value === 'show';
      applyRootWordVisibility();
    };
    applyTransliterationVisibility();
    applyRootWordVisibility();
    document.querySelectorAll('[data-size]').forEach(button => button.onclick = () => setFont(button.dataset.size, Number(button.dataset.change)));
    $('speedSelect').onchange = event => {
      speed = Number(event.target.value);
      if (isPlayMode && !isPaused) startAutoProgress();
    };
    $('zoomIn').onclick = () => { zoomLevel = Math.min(1.5, zoomLevel + .1); document.querySelector('.container').style.transform = `scale(${zoomLevel})`; };
    $('zoomOut').onclick = () => { zoomLevel = Math.max(.8, zoomLevel - .1); document.querySelector('.container').style.transform = `scale(${zoomLevel})`; };
    $('startOver').onclick = startOver;
    $('nextSurah').onclick = goToNextSurah;
    const controlsRow = document.querySelector('.controls-row');
    const updateQuizNavigationPosition = () => {
      if (document.body.classList.contains('read-mode')) return;
      const optionsRect = $('optionsContainer').getBoundingClientRect();
      if (optionsRect.height) {
        document.documentElement.style.setProperty('--quiz-navigation-top', `${optionsRect.top + optionsRect.height / 2}px`);
      }
    };
    const updateControlsHeight = () => {
      document.documentElement.style.setProperty('--controls-height', `${controlsRow.offsetHeight}px`);
      updateQuizNavigationPosition();
    };
    window.addEventListener('resize', updateControlsHeight);
    const layoutObserver = new ResizeObserver(updateControlsHeight);
    layoutObserver.observe(controlsRow);
    layoutObserver.observe($('optionsContainer'));
    updateControlsHeight();
    loadSurah();
  </script>
</body>
</html>
